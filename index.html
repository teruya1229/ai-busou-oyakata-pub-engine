<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI武装親方 出版エンジン MVP</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header card">
        <h1>AI武装親方 出版エンジン</h1>
        <p>現場の出来事から、4コマ構成・note本文・X投稿文を最小手順で生成するMVPです。</p>
      </header>

      <section class="card">
        <h2>入力</h2>
        <form id="input-form">
          <div class="field">
            <label for="theme">タイトルテーマ</label>
            <input id="theme" name="theme" type="text" placeholder="例: 段取り確認とAI活用" />
          </div>

          <div class="field">
            <label for="incident">現場で起きたこと</label>
            <textarea id="incident" name="incident" rows="4" placeholder="例: 朝礼後に作業順が食い違い、手戻りが発生した。"></textarea>
          </div>

          <div class="field">
            <label for="learning">今回の学び</label>
            <textarea id="learning" name="learning" rows="3" placeholder="例: 作業前の確認を短くても明文化するとズレが減る。"></textarea>
          </div>

          <div class="field">
            <label for="characters">登場人物</label>
            <input id="characters" name="characters" type="text" placeholder="例: 照屋親方、コパイロット、若手職人" />
          </div>

          <div class="field">
            <label for="tone">トーン</label>
            <select id="tone" name="tone">
              <option value="ゆるい">ゆるい</option>
              <option value="少し真面目">少し真面目</option>
              <option value="かなり真面目">かなり真面目</option>
              <option value="コミカル">コミカル</option>
            </select>
          </div>

          <div class="field">
            <label for="chapter-episodes">章確認用（複数エピソード入力）</label>
            <textarea
              id="chapter-episodes"
              name="chapterEpisodes"
              rows="6"
              placeholder="1エピソードごとに --- で区切って入力してください。&#10;例: 朝礼で段取りがずれた。&#10;---&#10;搬入導線が重なり、待ちが発生した。"
            ></textarea>
          </div>

          <div class="actions">
            <button type="button" id="generate-btn">構成を生成</button>
            <button type="button" id="chapter-preview-btn" class="subtle">章素材を確認</button>
            <button type="button" id="book-preview-btn" class="subtle">本素材を確認</button>
            <button type="button" id="example-btn" class="subtle">入力例を入れる</button>
            <button type="button" id="reset-btn" class="subtle">リセット</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="result-head">
          <h2>4コマ漫画構成</h2>
          <button type="button" data-copy-target="comic-output" class="copy-btn">コピー</button>
        </div>
        <pre id="comic-output" class="output-block">ここに生成結果が表示されます。</pre>
      </section>

      <section class="card">
        <div class="result-head">
          <h2>note記事本文</h2>
          <button type="button" data-copy-target="note-output" class="copy-btn">コピー</button>
        </div>
        <pre id="note-output" class="output-block">ここに生成結果が表示されます。</pre>
      </section>

      <section class="card">
        <div class="result-head">
          <h2>X投稿文</h2>
          <button type="button" data-copy-target="x-output" class="copy-btn">コピー</button>
        </div>
        <pre id="x-output" class="output-block">ここに生成結果が表示されます。</pre>
      </section>

      <section class="card">
        <div class="result-head">
          <h2>Kindle節素材プレビュー</h2>
          <button type="button" data-copy-target="kindle-output" class="copy-btn">コピー</button>
        </div>
        <pre id="kindle-output" class="output-block">ここに生成結果が表示されます。</pre>
      </section>

      <section class="card">
        <div class="result-head">
          <h2>Kindle章素材プレビュー</h2>
          <button type="button" data-copy-target="kindle-chapter-output" class="copy-btn">コピー</button>
        </div>
        <pre id="kindle-chapter-output" class="output-block">ここに生成結果が表示されます。</pre>
      </section>

      <section class="card">
        <div class="result-head">
          <h2>Kindle本素材プレビュー</h2>
          <button type="button" data-copy-target="kindle-book-output" class="copy-btn">コピー</button>
        </div>
        <pre id="kindle-book-output" class="output-block">ここに生成結果が表示されます。</pre>
      </section>
    </main>

    <script src="./js/templates.js"></script>
    <script src="./js/engine.js"></script>
    <script src="./js/kindle-engine.js"></script>
    <script src="./js/app.js"></script>
  </body>
  </html>
